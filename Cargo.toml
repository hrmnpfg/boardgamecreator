[package]
name = "boardgames"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib","cdylib"]

[dependencies]
napi = { version = "2.16.13", features=["serde-json","napi4"] }
napi-derive = "2.16.13"
serde = { version = "1.0.215", features=["derive"] }
serde_json = "1.0.133"

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
strip = "symbols"

[features]
napi-skip = []
